# Production configuration mounted into the backend container.
# Sensitive values should still be passed via environment overrides or secrets.
app:
  # Human-readable service name used in logs and dashboards.
  name: maxapp-itilium
  # Runtime environment for the production stack.
  env: production
  # Service version for release builds.
  version: 0.1.0
  # Disable demo mode so the real ITILIUM client is required.
  demo_mode: false

http:
  # Bind host for the HTTP API inside the container.
  host: 0.0.0.0
  # Bind port for the HTTP API inside the container.
  port: 3000
  # Request read timeout (multipart create with attachments).
  read_timeout: 60s
  # Response write timeout must exceed itilium.timeout: create_sc with attachments can take 60–90s.
  write_timeout: 120s
  # Keep-alive idle timeout.
  idle_timeout: 60s

logging:
  # JSON logs are better for Loki ingestion in production.
  level: info
  format: json

itilium:
  # Base URL should be overridden from the deployment environment.
  base_url: ""
  # Credentials should be overridden from the deployment environment.
  login: ""
  password: ""
  # Timeout for outbound ITILIUM requests.
  timeout: 50s

redis:
  # Redis cache host and port used in docker compose.
  address: redis:6379
  # Password should be overridden in production when auth is enabled.
  password: ""
  # Logical Redis database index.
  db: 0
  # Keep Redis enabled in production.
  enabled: true
