resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name ${CERT_DOMAIN};

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${CERT_DOMAIN};

    client_max_body_size 40m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~ /\.(ht|git|svn|env) {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied to the Go backend inside the compose network.
    location /api/ {
        # Создание заявки с вложениями: backend принимает до ~32 MiB multipart (файл до 15 MiB).
        client_max_body_size 40m;
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /healthz {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream/healthz;
    }

    location /readyz {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream/readyz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
