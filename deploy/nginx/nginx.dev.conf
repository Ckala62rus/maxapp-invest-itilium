server {
    listen 80;
    server_name _;

    # The dev server proxies the SPA to Vite so hot reload keeps working.
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The API is proxied to the Go backend.
    location /api/ {
        client_max_body_size 40m;
        proxy_pass http://backend-dev:3000/api/;
        proxy_http_version 1.1;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend-dev:3000/healthz;
    }

    location /readyz {
        proxy_pass http://backend-dev:3000/readyz;
    }

    location /metrics {
        proxy_pass http://backend-dev:3000/metrics;
    }
}
