<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MAX ITILIUM Mini App Prototype</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      (function () {
        var SELECTOR =
          'button,a[href],.ticket-card,.menu-toggle,.burger-menu-item,.primary-button,.secondary-button,.ghost-button,.page-button,.responsible-assign-button,.responsible-group-header'
        var sx = 0
        var sy = 0
        var startEl = null
        var lastEl = null
        var lastAt = 0
        var tapActivatedAt = 0
        var tapActivatedEl = null

        // Блокируем только отложенный «ghost click» браузера, не программный click() из touchend.
        document.addEventListener(
          'click',
          function (e) {
            var el = e.target && e.target.closest ? e.target.closest(SELECTOR) : null
            if (!el || el !== tapActivatedEl) return
            var dt = Date.now() - tapActivatedAt
            if (dt > 25 && dt < 800) {
              e.preventDefault()
              e.stopImmediatePropagation()
              tapActivatedEl = null
            }
          },
          true
        )

        function activate(el) {
          if (!el || el.disabled) return
          var now = Date.now()
          if (el === lastEl && now - lastAt < 400) return
          lastEl = el
          lastAt = now
          tapActivatedAt = Date.now()
          tapActivatedEl = el
          el.click()
          window.setTimeout(function () {
            if (tapActivatedEl === el) tapActivatedEl = null
          }, 800)
        }

        function purgeOverlays() {
          var body = document.body
          var root = document.documentElement
          if (!body || !root) return
          body.classList.remove('swal2-shown', 'swal2-height-auto')
          root.classList.remove('swal2-shown')
          document.querySelectorAll('.swal2-container').forEach(function (node) {
            if (body.classList.contains('swal2-shown')) return
            node.style.display = 'none'
            node.style.visibility = 'hidden'
            node.style.pointerEvents = 'none'
          })
        }

        document.addEventListener(
          'touchstart',
          function (e) {
            var t = e.touches && e.touches[0]
            if (!t) return
            sx = t.clientX
            sy = t.clientY
            startEl = e.target && e.target.closest ? e.target.closest(SELECTOR) : null
          },
          { capture: true, passive: true }
        )

        document.addEventListener(
          'touchend',
          function (e) {
            var t = e.changedTouches && e.changedTouches[0]
            if (!t) return
            var el =
              (e.target && e.target.closest && e.target.closest(SELECTOR)) || startEl
            startEl = null
            if (!el) return
            if (Math.abs(t.clientX - sx) > 14 || Math.abs(t.clientY - sy) > 14) return
            if (e.cancelable) e.preventDefault()
            activate(el)
          },
          { capture: true, passive: false }
        )

        window.__maxappTouchBridgeInstalled = true
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', purgeOverlays)
        } else {
          purgeOverlays()
        }
        window.addEventListener('pageshow', purgeOverlays)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
