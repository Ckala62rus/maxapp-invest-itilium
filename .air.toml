root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/maxapp-bot ./cmd/bot"
entrypoint = "./tmp/maxapp-bot"
# Run the API directly. Delve is optional — see `.air.debug.toml` and `documentation/local_development.md`.
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["frontend", "example", "node_modules", "tmp"]
delay = 500
stop_on_error = true
# Docker Desktop (Windows/macOS): bind mount changes often do not trigger inotify/fsnotify
# inside the Linux container, so Air never rebuilds. Polling fixes that; interval is ms.
poll = true
poll_interval = 500
