services:
  # Production backend container.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxapp-itilium-backend
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config.yml
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      REDIS_ENABLED: "true"
      ITILIUM_BASE_URL: ${ITILIUM_BASE_URL}
      ITILIUM_LOGIN: ${ITILIUM_LOGIN:-}
      ITILIUM_PASSWORD: ${ITILIUM_PASSWORD:-}
      ITILIUM_INSECURE_SKIP_VERIFY: ${ITILIUM_INSECURE_SKIP_VERIFY:-false}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-12h}
      AUTH_MAX_INIT_DATA_TTL: ${AUTH_MAX_INIT_DATA_TTL:-10m}
      AUTH_ALLOW_DEBUG_IDENTITY_HEADERS: "false"
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-60s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-120s}
    volumes:
      - ./deploy/config/app.prod.yml:/app/config.yml:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - appnet
    logging:
      driver: loki
      options:
        loki-url: "${LOKI_URL:-http://127.0.0.1:3100/loki/api/v1/push}"

  # Production web container serving the built Vue app.
  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        NGINX_CONF: nginx.ssl.template.conf
    container_name: maxapp-itilium-web
    restart: unless-stopped
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN}
    depends_on:
      - backend
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      # TLS certificate files provided on the host.
      - ./ssl:/etc/nginx/certs:ro
    networks:
      - appnet

  # Redis stores cache entries for repeated reads.
  redis:
    image: redis:7.4-alpine
    container_name: maxapp-itilium-redis
    restart: unless-stopped
    networks:
      - appnet

  # Loki stores container logs.
  loki:
    image: grafana/loki:3.4.1
    container_name: maxapp-itilium-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKI_HTTP_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - appnet

  # Prometheus scrapes the Go metrics endpoint.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: maxapp-itilium-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HTTP_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - backend
    networks:
      - appnet

  # Grafana visualizes metrics and logs.
  grafana:
    image: grafana/grafana:11.0.0
    container_name: maxapp-itilium-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - appnet

volumes:
  grafana_data:

networks:
  appnet:
    driver: bridge
