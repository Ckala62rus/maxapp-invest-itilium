services:
  # Production backend container.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxapp-itilium-backend
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config.yml
      APP_ENV: production
      REDIS_ENABLED: "true"
      ITILIUM_BASE_URL: ${ITILIUM_BASE_URL}
      ITILIUM_LOGIN: ${ITILIUM_LOGIN}
      ITILIUM_PASSWORD: ${ITILIUM_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - ./deploy/config/app.prod.yml:/app/config.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - appnet
    logging:
      driver: loki
      options:
        loki-url: "${LOKI_URL:-http://127.0.0.1:3100/loki/api/v1/push}"

  # Production web container serving the built Vue app.
  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: maxapp-itilium-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_HTTP_PORT:-8088}:80"
    networks:
      - appnet

  # Postgres stores application data and migration state.
  postgres:
    image: postgres:16-alpine
    container_name: maxapp-itilium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  # Redis stores cache entries for repeated reads.
  redis:
    image: redis:7.4-alpine
    container_name: maxapp-itilium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - appnet

  # Migrations are executed manually through this tools profile.
  migrate:
    image: migrate/migrate:v4.18.3
    container_name: maxapp-itilium-migrate
    profiles:
      - tools
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - appnet

  # Loki stores container logs.
  loki:
    image: grafana/loki:3.4.1
    container_name: maxapp-itilium-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - appnet

  # Prometheus scrapes the Go metrics endpoint.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: maxapp-itilium-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - backend
    networks:
      - appnet

  # Grafana visualizes metrics and logs.
  grafana:
    image: grafana/grafana:11.0.0
    container_name: maxapp-itilium-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - appnet

volumes:
  postgres_data:

networks:
  appnet:
    driver: bridge
